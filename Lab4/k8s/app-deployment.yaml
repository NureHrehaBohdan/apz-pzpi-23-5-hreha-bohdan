apiVersion: apps/v1
kind: Deployment
metadata:
  name: ski-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ski-app
  template:
    metadata:
      labels:
        app: ski-app
    spec:
      containers:
        - name: ski-app
          image: bbngrz/demo-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/ski_resort
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: password